<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教材費・ローテーション割り勘計算機</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX (CDN) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // エラーを防ぐため、SVGアイコンをコンポーネント化
        const Icons = {
            RotateCw: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            ),
            Calculator: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
            ),
            Plus: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
            ),
            CheckCircle: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            ),
            HelpCircle: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            ),
            History: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            ),
            Upload: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
            ),
            Download: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
            ),
            Trash2: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            ),
            FileText: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            ),
            Check: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
                </svg>
            )
        };

        function App() {
            // 入力フォームの状態
            const [totalAmount, setTotalAmount] = useState('');
            const [peopleCount, setPeopleCount] = useState('8');
            const [startNumber, setStartNumber] = useState('1');
            const [title, setTitle] = useState('');

            // 保存完了通知用のメッセージ状態
            const [toastMessage, setToastMessage] = useState('');

            // 履歴データ
            const [history, setHistory] = useState(() => {
                try {
                    const saved = localStorage.getItem('kyozai_calc_history');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            // 計算結果の状態
            const [result, setResult] = useState(null);

            // 履歴の永続化（ブラウザ内保存）
            useEffect(() => {
                try {
                    localStorage.setItem('kyozai_calc_history', JSON.stringify(history));
                } catch (e) {
                    console.error("LocalStorage save failed", e);
                }
            }, [history]);

            // トースト表示用の補助関数
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => {
                    setToastMessage('');
                }, 3000);
            };

            // 計算処理
            const handleCalculate = (e) => {
                e.preventDefault();
                const total = parseInt(totalAmount, 10);
                const count = parseInt(peopleCount, 10);
                const start = parseInt(startNumber, 10);

                if (isNaN(total) || total <= 0) {
                    alert('有効な合計金額を入力してください。');
                    return;
                }
                if (isNaN(count) || count <= 0) {
                    alert('有効な人数を入力してください。');
                    return;
                }
                if (isNaN(start) || start <= 0 || start > count) {
                    alert(`開始出席番号は 1 から ${count} の間で入力してください。`);
                    return;
                }

                const baseAmount = Math.floor(total / count);
                const remainder = total % count;

                // 端数を負担する人（+1円）の出席番号リストを計算
                const plusOneMembers = [];
                if (remainder > 0) {
                    for (let i = 0; i < remainder; i++) {
                        let memberNo = ((start - 1 + i) % count) + 1;
                        plusOneMembers.push(memberNo);
                    }
                }

                // 次回の開始番号
                const nextStartNumber = remainder > 0 
                    ? ((start - 1 + remainder) % count) + 1 
                    : start;

                const calcResult = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString('ja-JP'),
                    title: title.trim() || '教材費集金',
                    total,
                    count,
                    baseAmount,
                    remainder,
                    plusOneMembers,
                    startNumber: start,
                    nextStartNumber
                };

                setResult(calcResult);
            };

            // 履歴への追加
            const saveToHistory = () => {
                if (!result) return;
                setHistory([result, ...history]);
                // 自動的に次回の開始番号をフォームに反映
                setStartNumber(result.nextStartNumber.toString());
                showToast('履歴に保存しました！次回のスタート番号を更新しました。');
            };

            // 履歴削除
            const deleteHistoryItem = (id) => {
                if (confirm('この履歴を削除しますか？')) {
                    setHistory(history.filter(item => item.id !== id));
                    showToast('指定した履歴を削除しました。');
                }
            };

            // 全履歴削除
            const clearHistory = () => {
                if (confirm('すべての集金履歴を消去しますか？')) {
                    setHistory([]);
                    showToast('すべての履歴を消去しました。');
                }
            };

            // 履歴データのファイルエクスポート (JSON)
            const exportHistory = () => {
                if (history.length === 0) {
                    alert('保存されている履歴がありません。');
                    return;
                }
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(history, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                const today = new Date().toISOString().split('T')[0];
                downloadAnchor.setAttribute("download", `kyozai_history_${today}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast('バックアップファイルをダウンロードしました！');
            };

            // 履歴データのファイルインポート (JSON)
            const importHistory = (e) => {
                const fileReader = new FileReader();
                if (e.target.files && e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsedData = JSON.parse(event.target.result);
                            if (Array.isArray(parsedData)) {
                                if (confirm('現在の履歴を上書きしてバックアップデータを復元しますか？')) {
                                    setHistory(parsedData);
                                    if (parsedData.length > 0) {
                                        const latest = parsedData[0];
                                        if (latest.nextStartNumber) {
                                            setStartNumber(latest.nextStartNumber.toString());
                                            setPeopleCount(latest.count.toString());
                                        }
                                    }
                                    showToast('履歴データを正常に復元しました！');
                                }
                            } else {
                                alert('無効なファイル形式です。');
                            }
                        } catch (error) {
                            alert('ファイルの読み込みに失敗しました。正しいJSONファイルを選択してください。');
                        }
                    };
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8 relative">
                    
                    {/* 保存完了通知トーストメッセージ */}
                    {toastMessage && (
                        <div className="fixed top-5 right-5 z-50 bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-lg border border-emerald-500 flex items-center gap-2 animate-bounce">
                            <Icons.Check className="w-5 h-5 shrink-0" />
                            <span className="text-xs font-bold">{toastMessage}</span>
                        </div>
                    )}

                    <div className="max-w-4xl mx-auto space-y-6">
                        
                        {/* ヘッダー */}
                        <header className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="p-3 bg-blue-500 text-white rounded-xl shadow-md">
                                    <Icons.RotateCw className="w-8 h-8" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-slate-900">教材費・ローテーション割り勘計算機</h1>
                                    <p className="text-xs text-slate-500">端数（あまり）を出席番号順に公平にローテーション分担します。※結果を保存ボタンを押してください。そして他のPCで作業するときはバックアップしてください。</p>
                                </div>
                            </div>
                        </header>

                        <div className="grid md:grid-cols-12 gap-6">
                            
                            {/* 左側：入力フォーム */}
                            <div className="md:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-base font-bold text-slate-800 flex items-center gap-2 mb-4">
                                    <Icons.Calculator className="w-5 h-5 text-blue-500" />
                                    集金内容の入力
                                </h2>

                                <form onSubmit={handleCalculate} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">
                                            集金タイトル（任意）
                                        </label>
                                        <input
                                            type="text"
                                            placeholder="例: 4月度ドリル代"
                                            value={title}
                                            onChange={(e) => setTitle(e.target.value)}
                                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">
                                            合計金額 <span className="text-red-500">*</span>
                                        </label>
                                        <div className="relative">
                                            <input
                                                type="number"
                                                placeholder="例: 8505"
                                                value={totalAmount}
                                                onChange={(e) => setTotalAmount(e.target.value)}
                                                className="w-full pl-3 pr-8 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                                                required
                                            />
                                            <span className="absolute right-3 top-2.5 text-xs text-slate-400">円</span>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">
                                            対象人数 <span className="text-red-500">*</span>
                                        </label>
                                        <div className="relative">
                                            <input
                                                type="number"
                                                placeholder="例: 8"
                                                value={peopleCount}
                                                onChange={(e) => setPeopleCount(e.target.value)}
                                                className="w-full pl-3 pr-8 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                                                required
                                            />
                                            <span className="absolute right-3 top-2.5 text-xs text-slate-400">名</span>
                                        </div>
                                    </div>

                                    <div className="p-3 bg-blue-50/50 rounded-xl border border-blue-100">
                                        <label className="block text-xs font-semibold text-blue-900 mb-1 flex items-center justify-between">
                                            <span>今回のスタート出席番号</span>
                                            <span className="text-[10px] text-blue-600 font-normal">（前回からの続き）</span>
                                        </label>
                                        <div className="relative">
                                            <input
                                                type="number"
                                                min="1"
                                                max={peopleCount || '1'}
                                                value={startNumber}
                                                onChange={(e) => setStartNumber(e.target.value)}
                                                className="w-full pl-3 pr-8 py-2 text-sm border border-blue-200 bg-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                                                required
                                            />
                                            <span className="absolute right-3 top-2.5 text-xs text-slate-400">番</span>
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg shadow-sm hover:shadow transition flex items-center justify-center gap-2"
                                    >
                                        <Icons.Calculator className="w-4 h-4" />
                                        計算を実行する
                                    </button>
                                </form>
                            </div>

                            {/* 右側：計算結果表示 */}
                            <div className="md:col-span-7 space-y-6">
                                {result ? (
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6 animate-fadeIn">
                                        <div className="flex items-center justify-between border-b pb-3 border-slate-100">
                                            <div>
                                                <span className="text-xs text-blue-600 font-semibold bg-blue-50 px-2 py-0.5 rounded-full">
                                                    計算完了
                                                </span>
                                                <h3 className="text-lg font-bold text-slate-900 mt-1">{result.
