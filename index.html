<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教材費・ローテーション割り勘計算機　※＋結果を保存を押すことで計算結果が保存されます。ブラウザの保存されるので、他のPCで作業するときは一番下のバックアップを保存をしてください。</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX (CDN) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // エラーを防ぐため、SVGアイコンをコンポーネント化
        const Icons = {
            RotateCw: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            ),
            Calculator: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
            ),
            Plus: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
            ),
            CheckCircle: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            ),
            HelpCircle: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            ),
            History: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            ),
            Upload: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
            ),
            Download: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
            ),
            Trash2: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            ),
            FileText: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            ),
            Check: ({ className = "w-4 h-4" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
                </svg>
            )
        };

        function App() {
            // 入力フォームの状態
            const [totalAmount, setTotalAmount] = useState('');
            const [peopleCount, setPeopleCount] = useState('8');
            const [startNumber, setStartNumber] = useState('1');
            const [title, setTitle] = useState('');

            // 保存完了通知用のメッセージ状態
            const [toastMessage, setToastMessage] = useState('');

            // 履歴データ
            const [history, setHistory] = useState(() => {
                try {
                    const saved = localStorage.getItem('kyozai_calc_history');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            // 計算結果の状態
            const [result, setResult] = useState(null);

            // 履歴の永続化（ブラウザ内保存）
            useEffect(() => {
                try {
                    localStorage.setItem('kyozai_calc_history', JSON.stringify(history));
                } catch (e) {
                    console.error("LocalStorage save failed", e);
                }
            }, [history]);

            // トースト表示用の補助関数
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => {
                    setToastMessage('');
                }, 3000);
            };

            // 計算処理
            const handleCalculate = (e) => {
                e.preventDefault();
                const total = parseInt(totalAmount, 10);
                const count = parseInt(peopleCount, 10);
                const start = parseInt(startNumber, 10);

                if (isNaN(total) || total <= 0) {
                    alert('有効な合計金額を入力してください。');
                    return;
                }
                if (isNaN(count) || count <= 0) {
                    alert('有効な人数を入力してください。');
                    return;
                }
                if (isNaN(start) || start <= 0 || start > count) {
                    alert(`開始出席番号は 1 から ${count} の間で入力してください。`);
                    return;
                }

                const baseAmount = Math.floor(total / count);
                const remainder = total % count;

                // 端数を負担する人（+1円）の出席番号リストを計算
                const plusOneMembers = [];
                if (remainder > 0) {
                    for (let i = 0; i < remainder; i++) {
                        let memberNo = ((start - 1 + i) % count) + 1;
                        plusOneMembers.push(memberNo);
                    }
                }

                // 次回の開始番号
                const nextStartNumber = remainder > 0 
                    ? ((start - 1 + remainder) % count) + 1 
                    : start;

                const calcResult = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString('ja-JP'),
                    title: title.trim() || '教材費集金',
                    total,
                    count,
                    baseAmount,
                    remainder,
                    plusOneMembers,
                    startNumber: start,
                    nextStartNumber
                };

                setResult(calcResult);
            };

            // 履歴への追加
            const saveToHistory = () => {
                if (!result) return;
                setHistory([result, ...history]);
                // 自動的に次回の開始番号をフォームに反映
                setStartNumber(result.nextStartNumber.toString());
                showToast('履歴に保存しました！次回のスタート番号を更新しました。');
            };

            // 履歴削除
            const deleteHistoryItem = (id) => {
                if (confirm('この履歴を削除しますか？')) {
                    setHistory(history.filter(item => item.id !== id));
                    showToast('指定した履歴を削除しました。');
                }
            };

            // 全履歴削除
            const clearHistory = () => {
                if (confirm('すべての集金履歴を消去しますか？')) {
                    setHistory([]);
                    showToast('すべての履歴を消去しました。');
                }
            };

            // 履歴データのファイルエクスポート (JSON)
            const exportHistory = () => {
                if (history.length === 0) {
                    alert('保存されている履歴がありません。');
                    return;
                }
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(history, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                const today = new Date().toISOString().split('T')[0];
                downloadAnchor.setAttribute("download", `kyozai_history_${today}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast('バックアップファイルをダウンロードしました！');
            };

            // 履歴データのファイルインポート (JSON)
            const importHistory = (e) => {
                const fileReader = new FileReader();
                if (e.target.files && e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsedData = JSON.parse(event.target.result);
                            if (Array.isArray(parsedData)) {
                                if (confirm('現在の履歴を上書きしてバックアップデータを復元しますか？')) {
                                    setHistory(parsedData);
                                    if (parsedData.length > 0) {
                                        const latest = parsedData[0];
                                        if (latest.nextStartNumber) {
                                            setStartNumber(latest.nextStartNumber.toString());
                                            setPeopleCount(latest.count.toString());
                                        }
                                    }
                                    showToast('履歴データを正常に復元しました！');
                                }
                            } else {
                                alert('無効なファイル形式です。');
                            }
                        } catch (error) {
                            alert('ファイルの読み込みに失敗しました。正しいJSONファイルを選択してください。');
                        }
                    };
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8 relative">
                    
                    {/* 保存完了通知トーストメッセージ */}
                    {toastMessage && (
                        <div className="fixed top-5 right-5 z-50 bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-lg border border-emerald-500 flex items-center gap-2 animate-bounce">
                            <Icons.Check className="w-5 h-5 shrink-0" />
                            <span className="text-xs font-bold">{toastMessage}</span>
                        </div>
                    )}

                    <div className="max-w-4xl mx-auto space-y-6">
                        
                        {/* ヘッダー */}
                        <header className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="p-3 bg-blue-500 text-white rounded-xl shadow-md">
                                    <Icons.RotateCw className="w-8 h-8" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-slate-900">教材費・ローテーション割り勘計算機</h1>
                                    <p className="text-xs text-slate-500">端数（あまり）を出席番号順に公平にローテーション分担</p>
                                </div>
                            </div>
                        </header>

                        <div className="grid md:grid-cols-12 gap-6">
                            
                            {/* 左側：入力フォーム */}
                            <div className="md:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-base font-bold text-slate-800 flex items-center gap-2 mb-4">
                                    <Icons.Calculator className="w-5 h-5 text-blue-500" />
                                    集金内容の入力
                                </h2>

                                <form onSubmit={handleCalculate} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">
                                            集金タイトル（任意）
                                        </label>
                                        <input
                                            type="text"
                                            placeholder="例: 4月度ドリル代"
                                            value={title}
                                            onChange={(e) => setTitle(e.target.value)}
                                            className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">
                                            合計金額 <span className="text-red-500">*</span>
                                        </label>
                                        <div className="relative">
                                            <input
                                                type="number"
                                                placeholder="例: 8505"
                                                value={totalAmount}
                                                onChange={(e) => setTotalAmount(e.target.value)}
                                                className="w-full pl-3 pr-8 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                                                required
                                            />
                                            <span className="absolute right-3 top-2.5 text-xs text-slate-400">円</span>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">
                                            対象人数 <span className="text-red-500">*</span>
                                        </label>
                                        <div className="relative">
                                            <input
                                                type="number"
                                                placeholder="例: 8"
                                                value={peopleCount}
                                                onChange={(e) => setPeopleCount(e.target.value)}
                                                className="w-full pl-3 pr-8 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                                                required
                                            />
                                            <span className="absolute right-3 top-2.5 text-xs text-slate-400">名</span>
                                        </div>
                                    </div>

                                    <div className="p-3 bg-blue-50/50 rounded-xl border border-blue-100">
                                        <label className="block text-xs font-semibold text-blue-900 mb-1 flex items-center justify-between">
                                            <span>今回のスタート出席番号</span>
                                            <span className="text-[10px] text-blue-600 font-normal">（前回からの続き）</span>
                                        </label>
                                        <div className="relative">
                                            <input
                                                type="number"
                                                min="1"
                                                max={peopleCount || '1'}
                                                value={startNumber}
                                                onChange={(e) => setStartNumber(e.target.value)}
                                                className="w-full pl-3 pr-8 py-2 text-sm border border-blue-200 bg-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                                                required
                                            />
                                            <span className="absolute right-3 top-2.5 text-xs text-slate-400">番</span>
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg shadow-sm hover:shadow transition flex items-center justify-center gap-2"
                                    >
                                        <Icons.Calculator className="w-4 h-4" />
                                        計算を実行する
                                    </button>
                                </form>
                            </div>

                            {/* 右側：計算結果表示 */}
                            <div className="md:col-span-7 space-y-6">
                                {result ? (
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6 animate-fadeIn">
                                        <div className="flex items-center justify-between border-b pb-3 border-slate-100">
                                            <div>
                                                <span className="text-xs text-blue-600 font-semibold bg-blue-50 px-2 py-0.5 rounded-full">
                                                    計算完了
                                                </span>
                                                <h3 className="text-lg font-bold text-slate-900 mt-1">{result.title}</h3>
                                            </div>
                                            <button
                                                onClick={saveToHistory}
                                                className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow-sm hover:shadow transition flex items-center gap-1.5"
                                            >
                                                <Icons.Plus className="w-3.5 h-3.5" />
                                                この結果を保存
                                            </button>
                                        </div>

                                        {/* 基本内訳 */}
                                        <div className="grid grid-cols-2 gap-3 text-center">
                                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                <span className="text-[11px] text-slate-500 block mb-0.5">一人あたりの基本額</span>
                                                <span className="text-lg font-bold text-slate-800">{result.baseAmount.toLocaleString()} 円</span>
                                            </div>
                                            <div className="bg-amber-50 p-3 rounded-xl border border-amber-100">
                                                <span className="text-[11px] text-amber-700 block mb-0.5">端数（あまり）</span>
                                                <span className="text-lg font-bold text-amber-800">{result.remainder} 円</span>
                                            </div>
                                        </div>

                                        {/* ローテーション内訳の詳細 */}
                                        {result.remainder === 0 ? (
                                            <div className="p-4 bg-emerald-50 text-emerald-800 rounded-xl border border-emerald-100 flex items-center gap-3">
                                                <Icons.CheckCircle className="w-5 h-5 text-emerald-600 shrink-0" />
                                                <p className="text-xs font-medium">
                                                    端数はありません！全員均等に <strong>{result.baseAmount.toLocaleString()}円</strong> 支払いとなります。
                                                </p>
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                <h4 className="text-xs font-bold text-slate-700">【支払いパターンの割り振り】</h4>
                                                
                                                {/* +1円の人 */}
                                                <div className="p-3.5 bg-amber-500/10 border border-amber-200 rounded-xl space-y-2">
                                                    <div className="flex justify-between items-center text-xs font-bold text-amber-900">
                                                        <span>＋1円多く支払うグループ（{(result.baseAmount + 1).toLocaleString()} 円）</span>
                                                        <span className="bg-amber-200 text-amber-900 px-2 py-0.5 rounded text-[10px]">
                                                            {result.remainder} 名
                                                        </span>
                                                    </div>
                                                    <div className="flex flex-wrap gap-1.5 pt-1">
                                                        {result.plusOneMembers.map((no) => (
                                                            <span key={no} className="px-2.5 py-1 bg-amber-500 text-white font-bold text-xs rounded-lg shadow-sm">
                                                                出席番号 {no} 番
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* 基本額の人 */}
                                                <div className="p-3.5 bg-slate-100 border border-slate-200 rounded-xl space-y-2">
                                                    <div className="flex justify-between items-center text-xs font-bold text-slate-700">
                                                        <span>基本額のみ支払うグループ（{result.baseAmount.toLocaleString()} 円）</span>
                                                        <span className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded text-[10px]">
                                                            {result.count - result.remainder} 名
                                                        </span>
                                                    </div>
                                                    <p className="text-[11px] text-slate-500">
                                                        上記以外の出席番号の児童・生徒
                                                    </p>
                                                </div>
                                            </div>
                                        )}

                                        {/* 次回へのローテーション案内 */}
                                        <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl flex items-center justify-between">
                                            <div className="flex items-center gap-2">
                                                <Icons.RotateCw className="w-4 h-4 text-blue-600" />
                                                <div>
                                                    <p className="text-xs font-bold text-blue-900">次回の集金スタート番号</p>
                                                    <p className="text-[11px] text-blue-700">次はこの番号の人から端数を負担します</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-1 bg-white px-3 py-1.5 rounded-lg border border-blue-200 font-bold text-blue-600 text-sm shadow-sm">
                                                {result.nextStartNumber} 番
                                            </div>
                                        </div>

                                    </div>
                                ) : (
                                    /* 初期未計算表示 */
                                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center space-y-3 flex flex-col items-center justify-center min-h-[300px]">
                                        <div className="p-4 bg-slate-100 rounded-full text-slate-400">
                                            <Icons.FileText className="w-8 h-8" />
                                        </div>
                                        <h3 className="text-sm font-bold text-slate-700">計算結果がここに表示されます</h3>
                                        <p className="text-xs text-slate-400 max-w-xs">
                                            左側のフォームから金額・人数・開始出席番号を入力して「計算を実行する」を押してください。
                                        </p>
                                    </div>
                                )}

                                {/* 仕組みの簡単なヒント */}
                                <div className="bg-amber-50/60 p-4 rounded-xl border border-amber-200/60 text-xs text-amber-900 space-y-1.5">
                                    <div className="font-bold flex items-center gap-1.5 text-amber-900">
                                        <Icons.HelpCircle className="w-4 h-4 text-amber-600" />
                                        ローテーション運用の仕組み
                                    </div>
                                    <p className="leading-relaxed text-[11px] text-amber-800">
                                        端数（例えば3円）が出た場合、開始番号から順番に3名へ1円ずつ割り振ります。
                                        結果を保存すると、次回計算時に**「自動的に今回の次の番号」**がセットされるため、1年間を通して偏りなく公平に集金できます。
                                    </p>
                                </div>

                            </div>

                        </div>

                        {/* 下段：集金履歴一覧 ＆ 復元・バックアップ */}
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b pb-3 border-slate-100">
                                <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                    <Icons.History className="w-5 h-5 text-blue-500" />
                                    集金履歴（ローテーション記憶）
                                </h2>

                                {/* バックアップ・復元操作エリア */}
                                <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                                    {/* インポート (ファイル選択) */}
                                    <label className="cursor-pointer px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-200 transition flex items-center gap-1.5">
                                        <Icons.Upload className="w-3.5 h-3.5" />
                                        履歴を復元
                                        <input
                                            type="file"
                                            accept=".json"
                                            onChange={importHistory}
                                            className="hidden"
                                        />
                                    </label>

                                    {/* エクスポート */}
                                    <button
                                        onClick={exportHistory}
                                        disabled={history.length === 0}
                                        className="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold rounded-lg border border-blue-200 transition flex items-center gap-1.5"
                                    >
                                        <Icons.Download className="w-3.5 h-3.5" />
                                        バックアップ保存
                                    </button>

                                    {history.length > 0 && (
                                        <button
                                            onClick={clearHistory}
                                            className="p-1.5 text-slate-400 hover:text-rose-500 rounded transition ml-auto sm:ml-0"
                                            title="履歴を全消去"
                                        >
                                            <Icons.Trash2 className="w-4 h-4" />
                                        </button>
                                    )}
                                </div>
                            </div>

                            {history.length === 0 ? (
                                <p className="text-xs text-slate-400 text-center py-6">
                                    保存された集金履歴はありません。結果画面の「この結果を保存」から追加するか、「履歴を復元」からバックアップファイルを読み込んでください。
                                </p>
                            ) : (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs">
                                        <thead>
                                            <tr className="border-b border-slate-200 text-slate-400">
                                                <th className="pb-2 font-medium">日付 / タイトル</th>
                                                <th className="pb-2 font-medium">合計 / 人数</th>
                                                <th className="pb-2 font-medium">端数負担者 (+1円)</th>
                                                <th className="pb-2 font-medium">次回スタート</th>
                                                <th className="pb-2 text-right font-medium">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {history.map((item) => (
                                                <tr key={item.id} className="hover:bg-slate-50 transition">
                                                    <td className="py-3">
                                                        <div className="font-bold text-slate-800">{item.title}</div>
                                                        <div className="text-[10px] text-slate-400">{item.date}</div>
                                                    </td>
                                                    <td className="py-3">
                                                        <div className="font-semibold text-slate-700">{item.total.toLocaleString()} 円</div>
                                                        <div className="text-[10px] text-slate-400">{item.count} 名</div>
                                                    </td>
                                                    <td className="py-3">
                                                        {item.remainder > 0 ? (
                                                            <div className="flex flex-wrap gap-1">
                                                                {item.plusOneMembers.map((no) => (
                                                                    <span key={no} className="px-1.5 py-0.5 bg-amber-100 text-amber-800 font-bold rounded text-[10px]">
                                                                        {no}番
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        ) : (
                                                            <span className="text-slate-400">なし</span>
                                                        )}
                                                    </td>
                                                    <td className="py-3 font-bold text-blue-600">
                                                        {item.nextStartNumber} 番
                                                    </td>
                                                    <td className="py-3 text-right">
                                                        <button
                                                            onClick={() => deleteHistoryItem(item.id)}
                                                            className="p-1 text-slate-300 hover:text-rose-500 rounded transition"
                                                        >
                                                            <Icons.Trash2 className="w-4 h-4" />
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
